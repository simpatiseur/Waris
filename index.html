<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kromah Waris Moussa - Gardien de But Professionnel | Watanga FC">
<title>Kromah Waris Moussa | Gardien de But</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold2: #F0C060;
  --dark: #0A0A0A;
  --dark2: #111111;
  --dark3: #1A1A1A;
  --red: #C0392B;
  --white: #F5F5F0;
  --gray: #888;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--dark); color: var(--white); font-family: 'Barlow', sans-serif; overflow-x: hidden; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px;
  background: rgba(10,10,10,0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(201,168,76,0.15);
}
.nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.1em; color: var(--gold); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.lang-btn {
  background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.3);
  color: var(--gold); font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.75rem; letter-spacing: 0.15em; padding: 5px 10px; border-radius: 2px; cursor: pointer; transition: all 0.2s;
}
.lang-btn:hover { background: var(--gold); color: var(--dark); }
.nav-links { display: flex; gap: 16px; list-style: none; }
.nav-links a {
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem;
  letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover { color: var(--gold); }

/* HERO */
.hero {
  min-height: 100vh; display: flex; align-items: stretch;
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, #0A0A0A 0%, #1a0a00 50%, #0A0A0A 100%);
}
.hero-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 80% 50%, rgba(201,168,76,0.12) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 80%, rgba(192,57,43,0.08) 0%, transparent 50%);
}
.hero-lines {
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(201,168,76,0.03) 60px, rgba(201,168,76,0.03) 61px);
}
.hero-number {
  position: absolute; top: -20px; left: 10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(180px, 38vw, 380px);
  color: rgba(201,168,76,0.05); line-height: 1; pointer-events: none; z-index: 1;
}
.hero-layout {
  position: relative; z-index: 2;
  display: flex; width: 100%; min-height: 100vh;
  align-items: stretch;
}
.hero-left {
  flex: 0 0 55%; display: flex; flex-direction: column;
  justify-content: flex-end; padding: 80px 24px 60px;
}
.hero-right {
  flex: 0 0 45%; position: relative; overflow: hidden;
}
.hero-right img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: top center;
  display: block;
}
.hero-right::before {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(to right, var(--dark) 0%, transparent 30%),
              linear-gradient(to top, var(--dark) 0%, transparent 25%);
}
.hero-right::after {
  content: ''; position: absolute; inset: 0; z-index: 2;
  background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 60%);
}

.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.3);
  padding: 6px 16px; border-radius: 2px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 24px;
  animation: fadeUp 0.8s ease both;
}
.hero-badge::before { content: ''; width: 6px; height: 6px; background: var(--gold); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
.hero-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(48px, 12vw, 120px); line-height: 0.9; letter-spacing: 0.02em;
  animation: fadeUp 0.8s 0.1s ease both;
}
.hero-name .first { color: var(--white); }
.hero-name .last { color: var(--gold); display: block; -webkit-text-stroke: 2px var(--gold); }
.hero-position {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(16px, 4vw, 24px); font-weight: 700;
  letter-spacing: 0.3em; text-transform: uppercase; color: var(--gray); margin-top: 12px;
  animation: fadeUp 0.8s 0.2s ease both;
}
.hero-position span { color: var(--red); }
.hero-club {
  display: flex; align-items: center; gap: 12px; margin-top: 32px; padding-top: 32px;
  border-top: 1px solid rgba(255,255,255,0.1); animation: fadeUp 0.8s 0.3s ease both;
}
.hero-club-icon { width: 48px; height: 48px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.hero-club-info small { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); }
.hero-club-info strong { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 1.2rem; font-weight: 700; }
.hero-share-btn {
  margin-top: 20px; display: inline-flex; align-items: center; gap: 8px;
  background: #25D366; color: #fff; border: none; border-radius: 4px;
  padding: 10px 20px; font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.9rem; font-weight: 700; letter-spacing: 0.1em;
  cursor: pointer; transition: all 0.2s; animation: fadeUp 0.8s 0.4s ease both;
}
.hero-share-btn:hover { background: #1ebe5d; transform: translateY(-1px); }

/* SECTIONS */
section { padding: 72px 24px; }
.section-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 10vw, 72px); line-height: 1; margin-bottom: 32px; }

/* STATS */
.stats-section { background: var(--dark2); }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; margin-top: 32px; }
.stat-card {
  background: var(--dark3); padding: 28px 20px;
  position: relative; overflow: hidden; transition: transform 0.3s;
}
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--gold); transform: scaleX(0); transition: transform 0.3s; }
.stat-card:hover::before { transform: scaleX(1); }
.stat-card:hover { transform: translateY(-2px); }
.stat-number { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px, 11vw, 72px); line-height: 1; color: var(--gold); }
.stat-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); margin-top: 4px; }
.stat-season { font-size: 0.68rem; color: rgba(136,136,136,0.5); margin-top: 2px; }
.stat-edit-btn {
  position: absolute; top: 8px; right: 8px;
  background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.2);
  color: var(--gold); font-size: 0.65rem; padding: 2px 6px; border-radius: 2px;
  cursor: pointer; opacity: 0; transition: opacity 0.2s; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.1em;
}
.stat-card:hover .stat-edit-btn { opacity: 1; }

/* GALERIE */
.gallery-section { background: var(--dark); }
.gallery-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.gallery-tab {
  font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 7px 16px; border-radius: 2px; border: 1px solid rgba(201,168,76,0.25);
  color: var(--gray); background: transparent; cursor: pointer; transition: all 0.2s;
}
.gallery-tab.active, .gallery-tab:hover { background: var(--gold); color: var(--dark); border-color: var(--gold); }
.gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.gallery-item { aspect-ratio: 4/3; background: var(--dark3); border-radius: 2px; overflow: hidden; position: relative; cursor: pointer; transition: transform 0.3s; }
.gallery-item:hover { transform: scale(1.02); z-index: 1; }
.gallery-item.wide { grid-column: span 2; aspect-ratio: 16/7; }
.gallery-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, var(--dark3), #1e1200); border: 1px dashed rgba(201,168,76,0.15); }
.gallery-placeholder .gi { font-size: 2.5rem; }
.gallery-placeholder span { font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(201,168,76,0.4); }
.gallery-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7)); opacity: 0; transition: opacity 0.3s; display: flex; align-items: flex-end; padding: 12px; }
.gallery-item:hover .gallery-overlay { opacity: 1; }
.gallery-overlay span { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.gallery-upload-btn { width: 100%; margin-top: 16px; background: transparent; border: 1px dashed rgba(201,168,76,0.3); color: var(--gold); padding: 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
.gallery-upload-btn:hover { background: rgba(201,168,76,0.1); }

/* VIDEOS */
.videos-section { background: var(--dark2); }
.video-grid { display: grid; gap: 12px; margin-top: 0; }
.video-card {
  background: var(--dark3); border-radius: 4px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s;
}
.video-card:hover { border-color: rgba(201,168,76,0.2); }
.video-thumb {
  width: 100%; aspect-ratio: 16/9; background: #0a0a0a;
  position: relative; overflow: hidden;
}
.video-thumb video, .video-thumb iframe {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.video-play-btn {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.4); transition: background 0.3s; cursor: pointer;
}
.video-play-btn:hover { background: rgba(0,0,0,0.6); }
.video-play-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--gold); display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; padding-left: 4px; transition: transform 0.2s;
}
.video-play-btn:hover .video-play-icon { transform: scale(1.1); }
.video-meta { padding: 14px 16px; }
.video-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.03em; }
.video-info { font-size: 0.72rem; color: var(--gray); margin-top: 4px; letter-spacing: 0.05em; }
.video-upload-area {
  border: 2px dashed rgba(201,168,76,0.25); border-radius: 4px;
  padding: 36px 24px; text-align: center; cursor: pointer; transition: all 0.3s;
  background: rgba(201,168,76,0.02);
}
.video-upload-area:hover { border-color: var(--gold); background: rgba(201,168,76,0.06); }
.video-upload-area .upload-icon { font-size: 2.5rem; margin-bottom: 10px; }
.video-upload-area p { font-family: 'Barlow Condensed', sans-serif; font-size: 0.82rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.video-upload-area small { font-size: 0.7rem; color: var(--gray); }
.video-url-row { display: flex; gap: 8px; margin-top: 16px; }
.video-url-row input {
  flex: 1; background: var(--dark3); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 2px; padding: 10px 14px; color: var(--white);
  font-family: 'Barlow', sans-serif; font-size: 0.82rem; outline: none; transition: border-color 0.2s;
}
.video-url-row input:focus { border-color: var(--gold); }
.video-url-row button {
  background: var(--gold); color: var(--dark); border: none; border-radius: 2px;
  padding: 10px 16px; font-family: 'Barlow Condensed', sans-serif;
  font-size: 0.82rem; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s;
}
.video-url-row button:hover { background: var(--gold2); }

/* PALMARÈS */
.trophies-section { background: var(--dark); }
.trophies-grid { display: grid; gap: 12px; }
.trophy-card { background: var(--dark3); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; padding: 20px; display: flex; align-items: center; gap: 16px; transition: all 0.3s; position: relative; overflow: hidden; }
.trophy-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
.trophy-card:hover { border-color: rgba(201,168,76,0.2); transform: translateX(4px); }
.trophy-icon { font-size: 2rem; flex-shrink: 0; }
.trophy-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.05em; }
.trophy-club { font-size: 0.78rem; color: var(--gray); margin-top: 2px; }
.trophy-year { margin-left: auto; flex-shrink: 0; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--gold); }
.add-trophy-btn { width: 100%; padding: 14px; background: transparent; border: 1px dashed rgba(201,168,76,0.25); color: rgba(201,168,76,0.5); font-family: 'Barlow Condensed', sans-serif; font-size: 0.82rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s; margin-top: 8px; }
.add-trophy-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.05); }

/* PROGRESSION */
.progress-section { background: var(--dark2); }
.chart-container { margin-top: 8px; position: relative; }
.chart-legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.chart-canvas-wrap { background: var(--dark3); border-radius: 4px; padding: 20px 16px 12px; position: relative; border: 1px solid rgba(255,255,255,0.05); }
.chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
.chart-bar-group { flex: 1; display: flex; gap: 3px; align-items: flex-end; }
.chart-bar { flex: 1; border-radius: 2px 2px 0 0; transition: height 1.2s cubic-bezier(0.4,0,0.2,1); min-height: 4px; cursor: pointer; position: relative; }
.chart-bar:hover::after { content: attr(data-val); position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--dark); font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; padding: 2px 5px; border-radius: 2px; white-space: nowrap; }
.chart-bar.saves { background: linear-gradient(180deg, var(--gold2), var(--gold)); }
.chart-bar.cleansheets { background: linear-gradient(180deg, #6ee7b7, #10b981); }
.chart-bar.matches { background: linear-gradient(180deg, #93c5fd, #3b82f6); }
.chart-labels { display: flex; gap: 6px; margin-top: 8px; }
.chart-label-item { flex: 1; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; letter-spacing: 0.1em; color: var(--gray); }
.chart-grid-line { position: absolute; left: 16px; right: 16px; border-top: 1px dashed rgba(255,255,255,0.05); font-family: 'Barlow Condensed', sans-serif; font-size: 0.6rem; color: rgba(136,136,136,0.4); padding-left: 4px; }

/* PRESSE */
.press-section { background: var(--dark); }
.press-grid { display: grid; gap: 12px; }
.press-card { background: var(--dark3); border-radius: 4px; padding: 20px; border: 1px solid rgba(255,255,255,0.04); transition: all 0.3s; }
.press-card:hover { border-color: rgba(201,168,76,0.2); transform: translateY(-2px); }
.press-source { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.press-source-icon { width: 28px; height: 28px; background: rgba(201,168,76,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
.press-source-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); }
.press-date { font-size: 0.68rem; color: var(--gray); margin-left: auto; }
.press-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.03em; line-height: 1.3; margin-bottom: 8px; }
.press-excerpt { font-size: 0.8rem; color: var(--gray); line-height: 1.5; }
.press-quote { margin-top: 12px; padding: 12px 16px; background: rgba(201,168,76,0.08); border-left: 3px solid var(--gold); border-radius: 0 4px 4px 0; }
.press-quote p { font-size: 0.82rem; font-style: italic; color: rgba(245,245,240,0.8); line-height: 1.5; }
.press-quote cite { font-size: 0.7rem; color: var(--gold); font-style: normal; letter-spacing: 0.05em; }
.press-card-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); }
.press-action-btn { flex: 1; background: transparent; border: 1px solid rgba(201,168,76,0.25); color: var(--gold); padding: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
.press-action-btn:hover { background: rgba(201,168,76,0.1); }
.press-action-btn.danger { border-color: rgba(192,57,43,0.3); color: var(--red); }
.press-action-btn.danger:hover { background: rgba(192,57,43,0.1); }
.add-press-btn { width: 100%; padding: 14px; background: transparent; border: 1px dashed rgba(201,168,76,0.25); color: rgba(201,168,76,0.5); font-family: 'Barlow Condensed', sans-serif; font-size: 0.82rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.2s; margin-top: 8px; }
.add-press-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.05); }

/* PROFIL */
.profile-section { background: var(--dark2); }
.profile-grid { display: grid; gap: 0; }
.profile-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.profile-item:last-child { border-bottom: none; }
.profile-key { font-family: 'Barlow Condensed', sans-serif; font-size: 0.73rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); }
.profile-value { font-family: 'Barlow Condensed', sans-serif; font-size: 0.98rem; font-weight: 700; letter-spacing: 0.05em; text-align: right; }
.profile-value.gold { color: var(--gold); }

/* QUALITÉS */
.skills-section { background: var(--dark); }
.skills-list { display: flex; flex-direction: column; gap: 18px; margin-top: 32px; }
.skill-header { display: flex; justify-content: space-between; margin-bottom: 7px; }
.skill-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.83rem; letter-spacing: 0.15em; text-transform: uppercase; }
.skill-score { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--gold); }
.skill-bar { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.skill-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 2px; transform-origin: left; animation: fillBar 1.5s ease both; }
@keyframes fillBar { from{transform:scaleX(0)} to{transform:scaleX(1)} }

/* PARCOURS */
.career-section { background: var(--dark2); }
.timeline { position: relative; margin-top: 32px; padding-left: 24px; }
.timeline::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:1px; background:linear-gradient(180deg,var(--gold),transparent); }
.timeline-item { position: relative; padding: 0 0 36px 24px; }
.timeline-item::before { content:''; position:absolute; left:-4px; top:8px; width:8px; height:8px; background:var(--gold); border-radius:50%; }
.timeline-item.current::before { width:12px; height:12px; left:-6px; animation:glowDot 2s infinite; }
@keyframes glowDot { 0%,100%{box-shadow:0 0 8px var(--gold)} 50%{box-shadow:0 0 20px var(--gold),0 0 40px rgba(201,168,76,0.3)} }
.timeline-year { font-family:'Barlow Condensed',sans-serif; font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }
.timeline-club { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:0.05em; line-height:1; }
.timeline-league { font-size:0.78rem; color:var(--gray); margin-top:4px; }
.timeline-badge { display:inline-block; background:rgba(201,168,76,0.15); border:1px solid rgba(201,168,76,0.3); color:var(--gold); font-size:0.63rem; letter-spacing:0.15em; text-transform:uppercase; padding:2px 8px; border-radius:2px; margin-top:6px; }

/* CONTACT */
.contact-section { background: var(--dark); text-align: center; }
.contact-subtitle { color:var(--gray); font-size:0.88rem; margin-bottom:32px; max-width:300px; margin-left:auto; margin-right:auto; }
.contact-form { max-width:480px; margin:0 auto; }
.form-group { margin-bottom:14px; }
.form-group input, .form-group textarea { width:100%; background:var(--dark3); border:1px solid rgba(255,255,255,0.08); border-radius:2px; padding:13px 15px; color:var(--white); font-family:'Barlow',sans-serif; font-size:0.88rem; outline:none; transition:border-color 0.2s; }
.form-group input:focus, .form-group textarea:focus { border-color:var(--gold); }
.form-group textarea { height:110px; resize:none; }
.btn-contact { width:100%; background:var(--gold); color:var(--dark); border:none; padding:15px; font-family:'Barlow Condensed',sans-serif; font-size:0.98rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:all 0.2s; }
.btn-contact:hover { background:var(--gold2); transform:translateY(-1px); }
.share-section { margin-top: 32px; padding: 24px; background: rgba(37,211,102,0.08); border: 1px solid rgba(37,211,102,0.2); border-radius: 4px; }
.share-title { font-family:'Barlow Condensed',sans-serif; font-size:0.8rem; letter-spacing:0.2em; text-transform:uppercase; color:#25D366; margin-bottom:12px; }
.btn-share-wa { display:inline-flex; align-items:center; gap:10px; background:#25D366; color:#fff; border:none; border-radius:4px; padding:13px 28px; font-family:'Barlow Condensed',sans-serif; font-size:1rem; font-weight:700; letter-spacing:0.1em; cursor:pointer; transition:all 0.2s; }
.btn-share-wa:hover { background:#1ebe5d; transform:translateY(-1px); }
.social-links { display:flex; justify-content:center; gap:14px; margin-top:28px; }
.social-link { width:44px; height:44px; border:1px solid rgba(201,168,76,0.3); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; text-decoration:none; transition:all 0.2s; color:var(--gold); }
.social-link:hover { background:var(--gold); color:var(--dark); transform:translateY(-2px); }

/* FOOTER */
footer { background:var(--dark); padding:22px; text-align:center; border-top:1px solid rgba(255,255,255,0.05); }
footer p { font-size:0.72rem; color:rgba(136,136,136,0.5); letter-spacing:0.1em; }
footer span { color:var(--gold); }

/* TOAST */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--gold); color:var(--dark); padding:11px 22px; border-radius:4px; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.88rem; letter-spacing:0.1em; transition:transform 0.3s ease; z-index:1000; }
.toast.show { transform:translateX(-50%) translateY(0); }

/* REVEAL */
@keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
.reveal { opacity:0; transform:translateY(20px); transition:opacity 0.6s ease,transform 0.6s ease; }
.reveal.visible { opacity:1; transform:translateY(0); }

/* MODAL (générique) */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:var(--dark2); border:1px solid rgba(201,168,76,0.2); border-radius:6px; padding:28px; width:100%; max-width:400px; transform:scale(0.9); transition:transform 0.3s; max-height:90vh; overflow-y:auto; }
.modal-overlay.open .modal { transform:scale(1); }
.modal h3 { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; color:var(--gold); margin-bottom:20px; }
.modal input, .modal textarea, .modal select { width:100%; background:var(--dark3); border:1px solid rgba(255,255,255,0.08); border-radius:2px; padding:11px 14px; color:var(--white); font-family:'Barlow',sans-serif; font-size:0.88rem; outline:none; margin-bottom:10px; transition:border-color 0.2s; }
.modal textarea { resize:none; height:80px; }
.modal select option { background:var(--dark2); }
.modal input:focus, .modal textarea:focus { border-color:var(--gold); }
.modal-btns { display:flex; gap:10px; margin-top:6px; }
.btn-confirm { flex:1; background:var(--gold); color:var(--dark); border:none; padding:12px; font-family:'Barlow Condensed',sans-serif; font-size:0.9rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:all 0.2s; }
.btn-cancel { flex:1; background:transparent; color:var(--gray); border:1px solid rgba(255,255,255,0.1); padding:12px; font-family:'Barlow Condensed',sans-serif; font-size:0.9rem; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:all 0.2s; }
.btn-confirm:hover { background:var(--gold2); }
.btn-cancel:hover { border-color:var(--gray); color:var(--white); }

/* ADMIN PANEL */
.admin-toggle {
  position: fixed; bottom: 24px; right: 20px; z-index: 300;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--gold); border: none; font-size: 1.3rem;
  cursor: pointer; box-shadow: 0 4px 20px rgba(201,168,76,0.4);
  transition: all 0.2s; display: flex; align-items: center; justify-content: center;
}
.admin-toggle:hover { background: var(--gold2); transform: scale(1.1); }
.admin-panel {
  position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.92);
  display: none; flex-direction: column; overflow-y: auto; padding: 24px 20px;
}
.admin-panel.open { display: flex; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding-top: 16px; }
.admin-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--gold); }
.admin-close { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--white); padding: 8px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 0.82rem; letter-spacing: 0.15em; cursor: pointer; border-radius: 2px; transition: all 0.2s; }
.admin-close:hover { border-color: var(--gold); color: var(--gold); }
.admin-section { margin-bottom: 32px; }
.admin-section-title { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid rgba(201,168,76,0.2); }
.admin-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.admin-stat-item label { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); margin-bottom: 5px; }
.admin-stat-item input { width: 100%; background: var(--dark3); border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; padding: 10px 12px; color: var(--white); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; outline: none; color: var(--gold); transition: border-color 0.2s; }
.admin-stat-item input:focus { border-color: var(--gold); }
.admin-save-btn { width: 100%; padding: 14px; background: var(--gold); color: var(--dark); border: none; border-radius: 2px; font-family: 'Barlow Condensed', sans-serif; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; margin-top: 4px; }
.admin-save-btn:hover { background: var(--gold2); }
.admin-note { font-size: 0.72rem; color: rgba(136,136,136,0.6); margin-top: 8px; text-align: center; font-style: italic; }

/* mobile hero fix */
@media(max-width: 600px){
  .hero-layout { flex-direction: column; }
  .hero-left { flex: none; order: 2; padding-top: 30px; padding-bottom: 48px; }
  .hero-right { flex: none; order: 1; height: 55vw; min-height: 220px; }
  .hero-right img { object-position: center top; }
}
